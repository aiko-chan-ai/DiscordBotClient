name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [electron-v3]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm run requirement
      - name: Test BotClient plugin
        run: npm run test:botclient
      - name: Prepare integration test assets
        run: npm run build:deps
      - name: Compile application for integration tests
        run: npm run build:ts
      - name: Test Electron integration
        run: npm test
